<dialog
  #dialog
  class="dialog"
  [class]="size()"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
  (click)="onClick($event)"
>
  <div class="content">
    <header class="header">
      <div>
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (description()) {
          <p>{{ description() }}</p>
        }
      </div>
      <button type="button" class="close" aria-label="Fechar" (click)="closed.emit()">
        <app-icon name="x" [size]="18" />
      </button>
    </header>
    <div class="body"><ng-content /></div>
    <footer class="footer"><ng-content select="[modal-footer]" /></footer>
  </div>
</dialog>
