<app-auth-layout
  title="Bem-vindo(a) de volta"
  description="Entre com suas credenciais para acessar sua conta."
  switchPrompt="Ainda não tem conta?"
  switchLabel="Criar conta"
  switchLink="/cadastro"
>
  <form novalidate (submit)="submit($event)">
    <app-text-field
      label="E-mail"
      type="email"
      autocomplete="username"
      placeholder="seu@email.com"
      size="lg"
      icon="mail"
      [error]="errors().email"
      [(value)]="email"
    />

    <app-text-field
      label="Senha"
      autocomplete="current-password"
      placeholder="Digite sua senha"
      size="lg"
      icon="lock-keyhole"
      [type]="showPassword() ? 'text' : 'password'"
      [error]="errors().password"
      [(value)]="password"
    >
      <button
        trailing
        type="button"
        class="toggle-password"
        [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
      </button>
    </app-text-field>

    @if (formError()) {
      <p class="form-error" role="alert">
        <app-icon name="circle-alert" [size]="16" />
        {{ formError() }}
      </p>
    }

    <button appButton type="submit" size="lg" fullWidth class="submit" [loading]="submitting()">
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</app-auth-layout>
